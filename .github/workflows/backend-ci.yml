name: backend-ci

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test:
    name: ruff + pytest + pip-audit + openapi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit pyyaml

      - name: Ruff lint
        run: ruff check src tests scripts

      - name: Ruff format check
        run: ruff format --check src tests scripts

      - name: Pytest
        env:
          OPENSPARK_MOCK_OBS: "1"
          OPENSPARK_USE_ENV_SECRETS: "1"
        run: pytest -q

      - name: OpenAPI in sync
        run: |
          python scripts/export_openapi.py
          git diff --exit-code openapi.yaml \
            || (echo "openapi.yaml is stale — run scripts/export_openapi.py and commit" && exit 1)

      - name: pip-audit (dependency vulnerabilities)
        run: pip-audit --strict --progress-spinner off || true
        # `|| true`: advisory — surfaces CVEs in the log without
        # hard-failing the build on transitive advisories we can't fix
        # immediately. Flip to strict once the tree is clean.

  trivy-image:
    name: Trivy scan of the backend image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t open-spark/backend:ci --target runtime .

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: open-spark/backend:ci
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"   # advisory for now; raise to 1 to gate
