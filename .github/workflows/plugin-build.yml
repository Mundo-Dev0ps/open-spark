name: plugin-build

on:
  push:
    paths:
      - "plugin/**"
      - ".github/workflows/plugin-build.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "plugin/**"
  workflow_dispatch:

permissions:
  contents: read

# Native obs-spark-libre plugin build matrix.
#
# Each platform follows the same flow:
#   1. Install OBS Studio dev headers (libobs + obs-frontend-api)
#   2. Install Qt6 + Qt6 WebEngine
#   3. cmake configure + build
#   4. Upload the resulting plugin binary as an artifact
#
# We deliberately do NOT package an OBS distribution into the artifact —
# users drop the .so / .dll / .plugin into their existing OBS plugin
# directory. CI runs against the public runners; no self-hosted runners.

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-base-private-dev qt6-tools-dev \
            qt6-webengine-dev qt6-webengine-dev-tools \
            libqt6svg6-dev nlohmann-json3-dev \
            libobs-dev

      - name: Configure
        run: |
          cmake -S plugin -B plugin/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build plugin/build --parallel

      - name: Stage artifact
        run: |
          # Layout that OBS expects for system-wide installs:
          #   /usr/lib/x86_64-linux-gnu/obs-plugins/obs-spark-libre.so
          #   /usr/share/obs/obs-plugins/obs-spark-libre/locale/*.ini
          mkdir -p stage/usr/lib/x86_64-linux-gnu/obs-plugins
          mkdir -p stage/usr/share/obs/obs-plugins/obs-spark-libre/locale
          cp plugin/build/obs-spark-libre.so \
              stage/usr/lib/x86_64-linux-gnu/obs-plugins/
          cp -r plugin/data/locale/* \
              stage/usr/share/obs/obs-plugins/obs-spark-libre/locale/

          mkdir -p artifact/linux/64bit
          cp plugin/build/obs-spark-libre.so artifact/linux/64bit/
          cp -r plugin/data artifact/linux/

      - uses: actions/upload-artifact@v4
        with:
          name: obs-spark-libre-linux-x86_64
          path: artifact/linux

      - name: Read version
        id: ver
        run: |
          v=$(awk -F'"' '/VERSION/ {print $2; exit}' plugin/CMakeLists.txt \
              | tr -d '\n')
          [[ -z "$v" ]] && v="0.1.0"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build .rpm and .deb via fpm
        run: |
          sudo gem install --no-document fpm
          for kind in rpm deb; do
            fpm -s dir -t $kind \
                -n obs-spark-libre \
                -v "${{ steps.ver.outputs.version }}" \
                --description "Spark Libre — native OBS plugin (Qt dock + HTTP bridge to the Spark Libre Python backend)." \
                --url "https://github.com/${{ github.repository }}" \
                --license MIT \
                --maintainer "Spark Libre Contributors" \
                --architecture x86_64 \
                --depends obs-studio \
                --depends "libqt6core6 | libqt6core6t64" \
                --depends "libqt6widgets6 | libqt6widgets6t64" \
                --depends "libqt6network6 | libqt6network6t64" \
                -C stage \
                usr
          done
          mkdir -p packaging-out
          mv *.rpm *.deb packaging-out/

      - uses: actions/upload-artifact@v4
        with:
          name: obs-spark-libre-linux-packages
          path: packaging-out

  flatpak:
    name: Linux Flatpak extension
    runs-on: ubuntu-24.04
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Build Flatpak extension
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: obs-spark-libre.flatpak
          manifest-path: packaging/flatpak/com.sparklibre.Plugin.yml
          cache-key: flatpak-builder-${{ github.sha }}

  windows:
    name: Windows x86_64
    runs-on: windows-2022
    env:
      OBS_DEPS_VERSION: "2024-09-30"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6 (with WebEngine)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.2"
          modules: qtwebengine qtwebchannel qtpositioning
          arch: win64_msvc2019_64
          set-env: true

      - name: Fetch OBS Studio dev headers
        shell: pwsh
        run: |
          # Pre-built obs-studio dev SDK published by the obsproject org.
          $url  = "https://github.com/obsproject/obs-studio/releases/download/30.2.4/obs-studio-30.2.4-windows-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile obs-sdk.zip
          Expand-Archive obs-sdk.zip -DestinationPath obs-sdk
          echo "OBS_SDK=$env:GITHUB_WORKSPACE\obs-sdk" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          cmake -S plugin -B plugin/build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR;$env:OBS_SDK" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build plugin/build --config Release --parallel

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact\windows\obs-plugins\64bit | Out-Null
          Copy-Item plugin\build\Release\obs-spark-libre.dll artifact\windows\obs-plugins\64bit\
          Copy-Item -Recurse plugin\data artifact\windows\

      - uses: actions/upload-artifact@v4
        with:
          name: obs-spark-libre-windows-x86_64
          path: artifact/windows

  macos:
    name: macOS universal
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6 (with WebEngine)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.2"
          modules: qtwebengine qtwebchannel qtpositioning
          arch: clang_64
          set-env: true

      - name: Fetch OBS Studio dev headers
        run: |
          # Use the upstream macOS SDK package.
          curl -L -o obs-sdk.tar.xz \
            https://github.com/obsproject/obs-studio/releases/download/30.2.4/obs-studio-30.2.4-macos-universal.tar.xz
          mkdir -p obs-sdk && tar -xf obs-sdk.tar.xz -C obs-sdk
          echo "OBS_SDK=$GITHUB_WORKSPACE/obs-sdk" >> $GITHUB_ENV

      - name: Configure
        run: |
          cmake -S plugin -B plugin/build -G Xcode \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR;$OBS_SDK" \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build plugin/build --config Release --parallel

      - name: Stage artifact
        run: |
          mkdir -p artifact/macos
          cp -r plugin/build/Release/obs-spark-libre.plugin artifact/macos/

      - uses: actions/upload-artifact@v4
        with:
          name: obs-spark-libre-macos-universal
          path: artifact/macos
