name: plugin-build

on:
  push:
    paths:
      - "plugin/**"
      - ".github/workflows/plugin-build.yml"
    tags:
      - "v*"
  pull_request:
    paths:
      - "plugin/**"
  workflow_dispatch:

permissions:
  contents: write   # needed by the release job to attach artifacts

# Native obs-open-spark plugin build matrix.
#
# Each platform follows the same flow:
#   1. Install OBS Studio dev headers (libobs + obs-frontend-api)
#   2. Install Qt6 + Qt6 WebEngine
#   3. cmake configure + build
#   4. Upload the resulting plugin binary as an artifact
#
# We deliberately do NOT package an OBS distribution into the artifact —
# users drop the .so / .dll / .plugin into their existing OBS plugin
# directory. CI runs against the public runners; no self-hosted runners.

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo add-apt-repository -y ppa:obsproject/obs-studio
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-base-private-dev qt6-tools-dev \
            qt6-webengine-dev qt6-webengine-dev-tools \
            libqt6svg6-dev nlohmann-json3-dev \
            libobs-dev

      - name: Configure
        run: |
          cmake -S plugin -B plugin/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build plugin/build --parallel

      - name: Stage artifact
        run: |
          # Layout that OBS expects for system-wide installs:
          #   /usr/lib/x86_64-linux-gnu/obs-plugins/obs-open-spark.so
          #   /usr/share/obs/obs-plugins/obs-open-spark/locale/*.ini
          mkdir -p stage/usr/lib/x86_64-linux-gnu/obs-plugins
          mkdir -p stage/usr/share/obs/obs-plugins/obs-open-spark/locale
          cp plugin/build/obs-open-spark.so \
              stage/usr/lib/x86_64-linux-gnu/obs-plugins/
          cp -r plugin/data/locale/* \
              stage/usr/share/obs/obs-plugins/obs-open-spark/locale/

          mkdir -p artifact/linux/64bit
          cp plugin/build/obs-open-spark.so artifact/linux/64bit/
          cp -r plugin/data artifact/linux/

      - uses: actions/upload-artifact@v4
        with:
          name: obs-open-spark-linux-x86_64
          path: artifact/linux

      - name: Read version
        id: ver
        run: |
          v=$(awk -F'"' '/VERSION/ {print $2; exit}' plugin/CMakeLists.txt \
              | tr -d '\n')
          [[ -z "$v" ]] && v="0.1.0"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build .rpm and .deb via fpm
        run: |
          sudo gem install --no-document fpm
          for kind in rpm deb; do
            fpm -s dir -t $kind \
                -n obs-open-spark \
                -v "${{ steps.ver.outputs.version }}" \
                --description "Open Spark — native OBS plugin (Qt dock + HTTP bridge to the Open Spark Python backend)." \
                --url "https://github.com/${{ github.repository }}" \
                --license MIT \
                --maintainer "Open Spark Contributors" \
                --architecture x86_64 \
                --depends obs-studio \
                --depends "libqt6core6 | libqt6core6t64" \
                --depends "libqt6widgets6 | libqt6widgets6t64" \
                --depends "libqt6network6 | libqt6network6t64" \
                -C stage \
                usr
          done
          mkdir -p packaging-out
          mv *.rpm *.deb packaging-out/

      - uses: actions/upload-artifact@v4
        with:
          name: obs-open-spark-linux-packages
          path: packaging-out

  flatpak:
    name: Linux Flatpak extension
    runs-on: ubuntu-24.04
    container:
      image: bilelmoussaoui/flatpak-github-actions:gnome-46
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Validate AppStream metainfo
        # --no-net: URL reachability is environmental (Flathub's own
        # buildbot does the networked check against the public repo).
        # The single pedantic note is the uppercase CID, which is the
        # required naming convention for OBS plugin extensions.
        run: |
          appstreamcli validate --no-net \
            plugin/com.obsproject.Studio.Plugin.OpenSpark.metainfo.xml

      - name: Build Flatpak extension
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: obs-open-spark.flatpak
          # CI builds from the working tree (the .local manifest). The
          # pinned-git manifest without the suffix is the one submitted
          # to Flathub.
          manifest-path: packaging/flatpak/com.obsproject.Studio.Plugin.OpenSpark.local.yml
          cache-key: flatpak-builder-${{ github.sha }}

  windows:
    name: Windows x86_64
    runs-on: windows-2022
    env:
      OBS_DEPS_VERSION: "2024-09-30"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6 (with WebEngine)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.2"
          modules: qtwebengine qtwebchannel qtpositioning
          arch: win64_msvc2019_64
          set-env: true

      - name: Fetch OBS Studio dev headers
        shell: pwsh
        run: |
          # Pre-built obs-studio dev SDK published by the obsproject org.
          $url  = "https://github.com/obsproject/obs-studio/releases/download/30.2.4/obs-studio-30.2.4-windows-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile obs-sdk.zip
          Expand-Archive obs-sdk.zip -DestinationPath obs-sdk
          echo "OBS_SDK=$env:GITHUB_WORKSPACE\obs-sdk" >> $env:GITHUB_ENV

      - name: Configure
        shell: pwsh
        run: |
          cmake -S plugin -B plugin/build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR;$env:OBS_SDK" `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build plugin/build --config Release --parallel

      - name: Stage artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifact\windows\obs-plugins\64bit | Out-Null
          Copy-Item plugin\build\Release\obs-open-spark.dll artifact\windows\obs-plugins\64bit\
          Copy-Item -Recurse plugin\data artifact\windows\

      - uses: actions/upload-artifact@v4
        with:
          name: obs-open-spark-windows-x86_64
          path: artifact/windows

  macos:
    name: macOS universal
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt6 (with WebEngine)
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.2"
          modules: qtwebengine qtwebchannel qtpositioning
          arch: clang_64
          set-env: true

      - name: Fetch OBS Studio dev headers
        run: |
          # Use the upstream macOS SDK package.
          curl -L -o obs-sdk.tar.xz \
            https://github.com/obsproject/obs-studio/releases/download/30.2.4/obs-studio-30.2.4-macos-universal.tar.xz
          mkdir -p obs-sdk && tar -xf obs-sdk.tar.xz -C obs-sdk
          echo "OBS_SDK=$GITHUB_WORKSPACE/obs-sdk" >> $GITHUB_ENV

      - name: Configure
        run: |
          cmake -S plugin -B plugin/build -G Xcode \
            -DCMAKE_PREFIX_PATH="$Qt6_DIR;$OBS_SDK" \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build plugin/build --config Release --parallel

      - name: Stage artifact
        run: |
          mkdir -p artifact/macos
          cp -r plugin/build/Release/obs-open-spark.plugin artifact/macos/

      - uses: actions/upload-artifact@v4
        with:
          name: obs-open-spark-macos-universal
          path: artifact/macos

  # ---------------------------------------------------------------------------
  # release: only runs on tag pushes (v0.1.0, v0.2.0, …). Pulls every
  # platform artifact from the matrix jobs above, packs them, and
  # attaches them to a fresh GitHub Release (self-hosted distribution).
  # Flathub is published separately via a PR to github.com/flathub/flathub
  # using the pinned-git manifest — see packaging/README.md.
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [linux, flatpak, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download every platform artifact
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Repack artifacts for the release
        run: |
          set -eux
          mkdir -p release-assets

          # Linux: .so + locale → tarball
          if [[ -d dist/obs-open-spark-linux-x86_64 ]]; then
            tar -C dist/obs-open-spark-linux-x86_64 -czf \
                release-assets/obs-open-spark-linux-x86_64.tar.gz .
          fi

          # Linux: .rpm + .deb already named correctly, just copy.
          if [[ -d dist/obs-open-spark-linux-packages ]]; then
            cp dist/obs-open-spark-linux-packages/* release-assets/
          fi

          # Windows: .dll + data → zip
          if [[ -d dist/obs-open-spark-windows-x86_64 ]]; then
            (cd dist/obs-open-spark-windows-x86_64 \
             && zip -r ../../release-assets/obs-open-spark-windows-x86_64.zip .)
          fi

          # macOS: .plugin bundle → tarball (keeps symlinks, perms)
          if [[ -d dist/obs-open-spark-macos-universal ]]; then
            tar -C dist/obs-open-spark-macos-universal -czf \
                release-assets/obs-open-spark-macos-universal.tar.gz .
          fi

          # Flatpak bundle.
          for f in dist/**/*.flatpak; do
            [[ -f "$f" ]] && cp "$f" release-assets/
          done

          ls -la release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            obs-open-spark ${{ github.ref_name }}

            Native OBS plugin half of the Open Spark stack. Pair with the
            Python backend (Docker compose, see `start.sh` in the repo)
            for end-to-end usage.

            ## Install

            **Fedora / RHEL / openSUSE**
            ```bash
            sudo dnf install ./obs-open-spark-*.rpm
            ```

            **Debian / Ubuntu**
            ```bash
            sudo apt install ./obs-open-spark_*.deb
            ```

            **Flatpak (only if OBS itself is a Flatpak)**
            ```bash
            flatpak install --user obs-open-spark.flatpak
            ```

            **Windows / macOS / portable Linux** — drop the bundle into
            your OBS plugins directory (see `packaging/README.md`).
          files: |
            release-assets/*
