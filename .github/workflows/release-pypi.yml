name: release-pypi

# Publishes the Python backend to PyPI on every v* tag, so
# `pipx install open-spark` works on Linux / macOS / Windows alike.
#
# Uses PyPI "trusted publishing" (OIDC) — NO API token / secret. One-time
# setup on pypi.org → project `open-spark` → Publishing → add a trusted
# publisher with:
#   owner:        Mundo-Dev0ps
#   repository:   open-spark
#   workflow:     release-pypi.yml
#   environment:  pypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-publish:
    name: Build & publish to PyPI
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
