components:
  schemas:
    AgentChatRequest:
      properties:
        dry_run:
          default: false
          title: Dry Run
          type: boolean
        max_steps:
          default: 14
          maximum: 24.0
          minimum: 1.0
          title: Max Steps
          type: integer
        messages:
          items:
            $ref: '#/components/schemas/AgentMessage'
          minItems: 1
          title: Messages
          type: array
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
      required:
      - messages
      title: AgentChatRequest
      type: object
    AgentChatResponse:
      properties:
        created_inputs:
          default: []
          items:
            type: string
          title: Created Inputs
          type: array
        final_message:
          title: Final Message
          type: string
        model:
          title: Model
          type: string
        pending_confirmation:
          items:
            additionalProperties: true
            type: object
          title: Pending Confirmation
          type: array
        steps:
          items:
            $ref: '#/components/schemas/AgentToolCall'
          title: Steps
          type: array
        usage:
          additionalProperties: true
          title: Usage
          type: object
      required:
      - final_message
      - steps
      - pending_confirmation
      - model
      - usage
      title: AgentChatResponse
      type: object
    AgentMessage:
      properties:
        content:
          title: Content
          type: string
        role:
          title: Role
          type: string
      required:
      - role
      - content
      title: AgentMessage
      type: object
    AgentToolCall:
      properties:
        args:
          additionalProperties: true
          title: Args
          type: object
        executed:
          title: Executed
          type: boolean
        result:
          additionalProperties: true
          title: Result
          type: object
        tool:
          title: Tool
          type: string
      required:
      - tool
      - args
      - result
      - executed
      title: AgentToolCall
      type: object
    GenerateRequest:
      properties:
        height:
          default: 1080
          title: Height
          type: integer
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        prompt:
          maxLength: 4000
          minLength: 1
          title: Prompt
          type: string
        style:
          anyOf:
          - type: string
          - type: 'null'
          title: Style
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        width:
          default: 1920
          title: Width
          type: integer
      required:
      - prompt
      title: GenerateRequest
      type: object
    GenerateResponse:
      properties:
        html:
          title: Html
          type: string
        model:
          title: Model
          type: string
        overlay_id:
          title: Overlay Id
          type: string
        title:
          title: Title
          type: string
        url:
          title: Url
          type: string
        usage:
          additionalProperties: true
          title: Usage
          type: object
      required:
      - overlay_id
      - html
      - model
      - url
      - title
      - usage
      title: GenerateResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    InjectRequest:
      properties:
        overlay_id:
          title: Overlay Id
          type: string
        scene:
          anyOf:
          - type: string
          - type: 'null'
          title: Scene
        source_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Source Name
      required:
      - overlay_id
      title: InjectRequest
      type: object
    InjectResponse:
      properties:
        action:
          anyOf:
          - type: string
          - type: 'null'
          title: Action
        mock:
          title: Mock
          type: boolean
        name:
          title: Name
          type: string
        scene:
          title: Scene
          type: string
        url:
          title: Url
          type: string
      required:
      - name
      - url
      - scene
      - mock
      title: InjectResponse
      type: object
    RefineOverlayRequest:
      description: 'Iterative-edit payload.


        The user describes a *delta* ("make the background darker, add

        scanlines"). Backend feeds the LLM the existing HTML plus the delta

        and asks for a patched version. The overlay id + URL stay the same

        so the OBS Browser Source can pick up the new content with a

        cache-bust refresh.'
      properties:
        instruction:
          maxLength: 2000
          minLength: 1
          title: Instruction
          type: string
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        style:
          anyOf:
          - type: string
          - type: 'null'
          title: Style
      required:
      - instruction
      title: RefineOverlayRequest
      type: object
    RefineOverlayResponse:
      properties:
        model:
          title: Model
          type: string
        obs_action:
          anyOf:
          - type: string
          - type: 'null'
          title: Obs Action
        overlay_id:
          title: Overlay Id
          type: string
        title:
          title: Title
          type: string
        url:
          title: Url
          type: string
      required:
      - overlay_id
      - url
      - model
      - title
      title: RefineOverlayResponse
      type: object
    RegenerateOverlayRequest:
      properties:
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Prompt
        style:
          anyOf:
          - type: string
          - type: 'null'
          title: Style
      title: RegenerateOverlayRequest
      type: object
    RegenerateOverlayResponse:
      properties:
        model:
          title: Model
          type: string
        obs_action:
          anyOf:
          - type: string
          - type: 'null'
          title: Obs Action
        overlay_id:
          title: Overlay Id
          type: string
        title:
          title: Title
          type: string
        url:
          title: Url
          type: string
      required:
      - overlay_id
      - url
      - model
      - title
      title: RegenerateOverlayResponse
      type: object
    SceneSourceInfo:
      properties:
        name:
          title: Name
          type: string
        overlay_id:
          title: Overlay Id
          type: string
        role:
          title: Role
          type: string
        transform:
          $ref: '#/components/schemas/SceneTransform'
        url:
          title: Url
          type: string
      required:
      - overlay_id
      - name
      - role
      - url
      - transform
      title: SceneSourceInfo
      type: object
    SceneTemplateRequest:
      properties:
        canvas_height:
          default: 1080
          title: Canvas Height
          type: integer
        canvas_width:
          default: 1920
          title: Canvas Width
          type: integer
        model:
          anyOf:
          - type: string
          - type: 'null'
          title: Model
        prompt:
          maxLength: 4000
          minLength: 1
          title: Prompt
          type: string
        replace:
          default: false
          title: Replace
          type: boolean
        scene_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Scene Name
        style:
          anyOf:
          - type: string
          - type: 'null'
          title: Style
      required:
      - prompt
      title: SceneTemplateRequest
      type: object
    SceneTemplateResponse:
      properties:
        mock:
          title: Mock
          type: boolean
        model:
          title: Model
          type: string
        scene:
          title: Scene
          type: string
        sources:
          items:
            $ref: '#/components/schemas/SceneSourceInfo'
          title: Sources
          type: array
        usage:
          additionalProperties: true
          title: Usage
          type: object
      required:
      - scene
      - model
      - sources
      - usage
      - mock
      title: SceneTemplateResponse
      type: object
    SceneTransform:
      properties:
        height:
          default: 1080
          title: Height
          type: integer
        width:
          default: 1920
          title: Width
          type: integer
        x:
          default: 0
          title: X
          type: integer
        y:
          default: 0
          title: Y
          type: integer
      title: SceneTransform
      type: object
    SecretPayload:
      properties:
        kind:
          title: Kind
          type: string
        provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
        value:
          minLength: 1
          title: Value
          type: string
      required:
      - kind
      - value
      title: SecretPayload
      type: object
    SettingsPayload:
      description: Editable runtime settings. Secrets handled separately.
      properties:
        agent_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Model
        default_model:
          anyOf:
          - type: string
          - type: 'null'
          title: Default Model
        llm_base_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Llm Base Url
        obs_host:
          anyOf:
          - type: string
          - type: 'null'
          title: Obs Host
        obs_port:
          anyOf:
          - type: integer
          - type: 'null'
          title: Obs Port
        obs_scene_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Obs Scene Name
        overlay_quality_passes:
          anyOf:
          - type: integer
          - type: 'null'
          title: Overlay Quality Passes
      title: SettingsPayload
      type: object
    StatusResponse:
      properties:
        default_model:
          title: Default Model
          type: string
        has_default_llm_key:
          title: Has Default Llm Key
          type: boolean
        mock_obs:
          title: Mock Obs
          type: boolean
        obs_connected:
          title: Obs Connected
          type: boolean
        overlay_count:
          title: Overlay Count
          type: integer
        version:
          title: Version
          type: string
      required:
      - obs_connected
      - mock_obs
      - default_model
      - has_default_llm_key
      - overlay_count
      - version
      title: StatusResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  title: Open Spark
  version: 0.1.0
openapi: 3.1.0
paths:
  /:
    get:
      operationId: root__get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Root
  /api/agent/chat:
    post:
      description: 'Conversational agent: chat in, OBS actions out.


        The LLM is given the full tool registry (overlays, scenes, camera,

        transforms, filters, …) and drives a tool-calling loop against the

        live OBS session. ``dry_run`` makes destructive tools report instead

        of execute so the UI can confirm first.'
      operationId: agent_chat_api_agent_chat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentChatRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentChatResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Agent Chat
  /api/agent/chat/stream:
    post:
      description: 'Server-Sent Events variant of /api/agent/chat.


        Emits one ``event: step`` per tool call as it completes and a final

        ``event: final`` with the summary, so the dock can render tool

        cards live instead of staring at a spinner for the whole loop.'
      operationId: agent_chat_stream_api_agent_chat_stream_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentChatRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Agent Chat Stream
  /api/agent/model-check:
    get:
      description: 'Validate a model id for tool calling before the user saves it.


        Returns {supported: true|false|null, reason, suggestions}. The

        plugin Settings tab calls this to show an inline green/red badge.'
      operationId: agent_model_check_api_agent_model_check_get
      parameters:
      - in: query
        name: model
        required: true
        schema:
          title: Model
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Agent Model Check Api Agent Model Check Get
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Agent Model Check
  /api/agent/session:
    delete:
      description: 'Wipe the persisted transcript so the next chat starts fresh —

        avoids an old goal contaminating a new conversation.'
      operationId: agent_session_clear_api_agent_session_delete
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Agent Session Clear Api Agent Session Delete
                type: object
          description: Successful Response
      summary: Agent Session Clear
    get:
      description: Return the last persisted agent transcript (for dock resume).
      operationId: agent_session_api_agent_session_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Agent Session Api Agent Session Get
                type: object
          description: Successful Response
      summary: Agent Session
  /api/agent/tools:
    get:
      description: Expose the tool catalogue (names + descriptions) for the UI.
      operationId: agent_tools_api_agent_tools_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Agent Tools Api Agent Tools Get
                type: object
          description: Successful Response
      summary: Agent Tools
  /api/agent/undo:
    post:
      description: 'Remove inputs the agent created (whole turn undo).


        ``inputs`` in the body overrides; otherwise the last persisted

        session''s created_inputs are removed via RemoveInput.'
      operationId: agent_undo_api_agent_undo_post
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              title: Payload
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Agent Undo Api Agent Undo Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Agent Undo
  /api/generate:
    post:
      operationId: generate_api_generate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Generate
  /api/inject:
    post:
      operationId: inject_api_inject_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InjectRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InjectResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Inject
  /api/overlays:
    delete:
      description: Wipe every saved overlay. Files + index. Idempotent.
      operationId: delete_all_overlays_api_overlays_delete
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Delete All Overlays Api Overlays Delete
                type: object
          description: Successful Response
      summary: Delete All Overlays
    get:
      operationId: list_overlays_api_overlays_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                title: Response List Overlays Api Overlays Get
                type: array
          description: Successful Response
      summary: List Overlays
  /api/overlays/{overlay_id}:
    delete:
      operationId: delete_overlay_api_overlays__overlay_id__delete
      parameters:
      - in: path
        name: overlay_id
        required: true
        schema:
          title: Overlay Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Delete Overlay Api Overlays  Overlay Id  Delete
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete Overlay
  /api/overlays/{overlay_id}/refine:
    post:
      description: 'Iterative-edit an existing overlay.


        The user submits an instruction (e.g. "make the chat box smaller and

        push it down 80px"). Backend loads the current HTML, asks the LLM

        to patch it, then overwrites the file in place — overlay id and

        URL stay stable so the OBS Browser Source picks up the change on

        a cache-bust refresh.'
      operationId: refine_overlay_api_overlays__overlay_id__refine_post
      parameters:
      - in: path
        name: overlay_id
        required: true
        schema:
          title: Overlay Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefineOverlayRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefineOverlayResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Refine Overlay
  /api/overlays/{overlay_id}/regenerate:
    post:
      description: 'Re-run the LLM and overwrite an existing overlay''s HTML in place.


        The overlay URL stays the same, so any OBS Browser Source pointing

        at it picks up the new content on a Refresh (or via reinject).'
      operationId: regenerate_overlay_api_overlays__overlay_id__regenerate_post
      parameters:
      - in: path
        name: overlay_id
        required: true
        schema:
          title: Overlay Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegenerateOverlayRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegenerateOverlayResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Regenerate Overlay
  /api/scenes/templates:
    post:
      description: 'Generate a multi-source OBS scene from one prompt.


        Pipeline: LLM → JSON layout → save each HTML as overlay → OBS scene

        with positioned Browser Sources.'
      operationId: scene_template_api_scenes_templates_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SceneTemplateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SceneTemplateResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Scene Template
  /api/secrets:
    post:
      operationId: set_secret_api_secrets_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretPayload'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Set Secret Api Secrets Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Set Secret
  /api/secrets/llm/{provider}:
    delete:
      operationId: delete_llm_secret_api_secrets_llm__provider__delete
      parameters:
      - in: path
        name: provider
        required: true
        schema:
          title: Provider
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Delete Llm Secret Api Secrets Llm  Provider  Delete
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete Llm Secret
  /api/settings:
    get:
      operationId: get_settings_api_settings_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Get Settings Api Settings Get
                type: object
          description: Successful Response
      summary: Get Settings
    put:
      operationId: update_settings_api_settings_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPayload'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Update Settings Api Settings Put
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Update Settings
  /api/status:
    get:
      operationId: status_api_status_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
          description: Successful Response
      summary: Status
  /api/styles:
    get:
      description: Available style preset keys for the UI dropdown.
      operationId: list_styles_api_styles_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                title: Response List Styles Api Styles Get
                type: array
          description: Successful Response
      summary: List Styles
  /healthz:
    get:
      description: 'Liveness/readiness probe. Never raises; reports component state

        so a supervisor / compose healthcheck can act on it.'
      operationId: healthz_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Healthz Healthz Get
                type: object
          description: Successful Response
      summary: Healthz
  /overlays/{overlay_id}.html:
    get:
      operationId: serve_overlay_overlays__overlay_id__html_get
      parameters:
      - in: path
        name: overlay_id
        required: true
        schema:
          title: Overlay Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Serve Overlay
