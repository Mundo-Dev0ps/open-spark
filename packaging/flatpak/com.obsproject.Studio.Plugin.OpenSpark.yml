# Flathub submission manifest — Open Spark OBS plugin.
#
# This is the manifest you copy into the Flathub submission repo
# (github.com/flathub/flathub, see packaging/README.md → "Publishing to
# Flathub"). It builds the plugin as an *extension* of the official OBS
# Studio Flatpak (com.obsproject.Studio), which auto-discovers any
# extension whose ID starts with `com.obsproject.Studio.Plugin.`.
#
# Flathub builds in a clean, network-isolated sandbox, so the source
# MUST be a pinned git tag + commit (no local dirs, no floating refs).
# For local / CI builds use the *.local.yml manifest instead.
#
# runtime-version MUST match whatever org.kde.Platform the current
# com.obsproject.Studio build uses. Check before submitting:
#   flatpak info -m com.obsproject.Studio | grep runtime

id: com.obsproject.Studio.Plugin.OpenSpark
# Must match the runtime/sdk the currently-published com.obsproject.Studio
# Flatpak ships against. As of 2026: Freedesktop 25.08. Verify before
# submitting:  flatpak info -m com.obsproject.Studio | grep -i runtime
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk

# Compose against the OBS Studio Flatpak so its extension point
# `com.obsproject.Studio.Plugin` is visible to flatpak-builder.
base: com.obsproject.Studio
base-version: stable

build-extension: true
appstream-compose: true
build-options:
  prefix: /app/plugins/OpenSpark
separate-locales: false

modules:
  - name: obs-open-spark
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app/plugins/OpenSpark
    sources:
      - type: git
        url: https://github.com/Mundo-Dev0ps/open-spark.git
        tag: v0.1.0
        # Flathub requires the exact commit the tag points at. Fill this
        # with `git rev-list -n 1 v0.1.0` before opening the PR.
        commit: REPLACE_WITH_TAG_COMMIT_SHA
    # The plugin's CMakeLists installs:
    #   <prefix>/lib/obs-plugins/obs-open-spark.so
    #   <prefix>/share/obs/obs-plugins/obs-open-spark/locale/*.ini
    #   <prefix>/share/metainfo/com.obsproject.Studio.Plugin.OpenSpark.metainfo.xml
    cleanup:
      - /include
      - /lib/pkgconfig
      - "*.la"
      - "*.a"
