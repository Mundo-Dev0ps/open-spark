# Flatpak manifest for the obs-open-spark native plugin.
#
# This builds the plugin as a Flatpak extension that targets the
# official OBS Studio Flatpak (com.obsproject.Studio). End users install
# the resulting .flatpak with:
#
#     flatpak install --user obs-open-spark.flatpak
#
# OBS Studio Flatpak auto-discovers extensions whose ID starts with
# `com.obsproject.Studio.Plugin.`, so we follow that convention.

id: com.obsproject.Studio.Plugin.OpenSpark
runtime: org.kde.Platform
runtime-version: "6.7"
sdk: org.kde.Sdk
# Extension point published by the OBS Studio Flatpak.
build-extension: true
build-options:
  prefix: /app/plugins/OpenSpark
separate-locales: false

modules:
  - name: obs-open-spark
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app/plugins/OpenSpark
    sources:
      - type: dir
        path: ../../plugin
    # The OBS Studio Flatpak loads plugins from
    # /app/plugins/<Name>/lib/obs-plugins/ — the install step in
    # CMakeLists.txt already puts the .so under <prefix>/lib/obs-plugins/.
    cleanup:
      - /include
      - /lib/pkgconfig
      - "*.la"
