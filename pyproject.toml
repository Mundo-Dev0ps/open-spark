[project]
name = "open-spark"
version = "0.1.0"
description = "Generate OBS overlays from natural language. Local-first, LLM-agnostic."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Open Spark Contributors" }]
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "obsws-python>=1.6",
    "litellm>=1.50",
    "keyring>=25.0",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]
tray = [
    # Native window + system-tray icon. Linux needs a Qt or GTK backend
    # available at runtime; pywebview picks Qt6 when present.
    "pywebview>=5.0",
    "pystray>=0.19",
    "pillow>=10.0",
    "PyQt6>=6.6 ; sys_platform == 'linux'",
    "PyQt6-WebEngine>=6.6 ; sys_platform == 'linux'",
]

[project.scripts]
open-spark = "open_spark.__main__:main"
open-spark-install-dock = "open_spark.scripts.install_dock:main"
open-spark-tray = "open_spark.tray:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/open_spark"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
